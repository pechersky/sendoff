name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each lints its platform's code: aarch64 has NEON, Windows no mmap.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Check Clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: fuzz
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked --version 0.13.2
    # A crash prints its input; `cargo fuzz run -s none <target> <file>`
    # replays it.
    - name: Fuzz each target for a minute
      working-directory: fuzz
      run: |
        for target in $(cargo fuzz list); do
          cargo fuzz run -s none "$target" -- \
            -max_total_time=60 -max_len=4096 -rss_limit_mb=2048
        done

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true
        allow-prereleases: false
        freethreaded: false
    - name: Check the release tag against the Cargo version
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path
        version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
        assert os.environ["RELEASE_TAG"] == f"v{version}", "tag/Cargo version mismatch"
        PY
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          rustup component add llvm-tools-preview
        fi
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-directories: .cache/rust-coverage/target
    - name: Test with tox
      run: |
        uv pip install --system 'tox>=4.24,<5' 'tox-uv>=1.16,<2'
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          python -m tox -e py
        else
          python -m tox -e py -- --no-rust-coverage
        fi

  automerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [clippy, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'pre-commit-ci[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pre-commit-ci-update-config'
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Wait for pre-commit.ci and merge
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import subprocess
        import time

        repo = os.environ["GITHUB_REPOSITORY"]
        sha = os.environ["HEAD_SHA"]
        pr = os.environ["PR_NUMBER"]
        state = "pending"
        for attempt in range(30):
            out = subprocess.check_output(
                ["gh", "api", f"repos/{repo}/commits/{sha}/status"], text=True
            )
            statuses = {
                s["context"]: s["state"] for s in json.loads(out)["statuses"]
            }
            state = statuses.get("pre-commit.ci - pr", "pending")
            if state != "pending":
                break
            time.sleep(5)
        assert state == "success", f"pre-commit.ci - pr state is {state!r}"
        subprocess.run(
            [
                "gh",
                "pr",
                "merge",
                pr,
                "--repo",
                repo,
                "--squash",
                "--delete-branch",
                "--match-head-commit",
                sha,
            ],
            check=True,
        )
        PY

  wheels:
    needs: [clippy, test, fuzz]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/wheels.yml

  # PyPI trusts this workflow and environment to publish sendoff.
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/sendoff/
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: sendoff-*
        path: dist
        merge-multiple: true
    # Eight platforms: manylinux and musllinux on x86_64 and aarch64, macOS
    # and Windows on x86_64 and arm64.
    - name: Check the artifact set
      run: |
        python3 - <<'PY'
        import tomllib
        from collections import Counter
        from pathlib import Path
        version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
        names = {path.name for path in Path("dist").iterdir()}
        wheels = {name for name in names if name.endswith(".whl")}
        assert names - wheels == {f"sendoff-{version}.tar.gz"}, sorted(names - wheels)
        assert all(name.startswith(f"sendoff-{version}-") for name in wheels)
        abis = Counter(name.split("-")[3] for name in wheels)
        expected = dict.fromkeys(["cp311", "cp312", "cp313", "cp314", "cp315", "abi3"], 8)
        assert abis == expected, abis
        PY
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: sendoff-*
        path: dist
        merge-multiple: true
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
