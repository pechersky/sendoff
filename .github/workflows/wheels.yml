name: Build wheels

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
    paths:
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - rust/**
      - sendoff/**
      - scripts/pgo-build
      - setup.cfg
      - tests/**
      - .github/workflows/wheels.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - rust/**
      - sendoff/**
      - scripts/pgo-build
      - setup.cfg
      - tests/**
      - .github/workflows/wheels.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.abi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
        abi: [per-version, abi3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux builds install Rust in the container (pyproject.toml).
      - name: Set up Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable
      # One abi3 wheel serves CPython 3.15 and later; test it on the oldest
      # and newest supported versions.
      - name: Select the abi3 build
        if: matrix.abi == 'abi3'
        shell: bash
        run: |
          echo 'MATURIN_PEP517_ARGS=--features abi3' >> "$GITHUB_ENV"
          echo 'CIBW_BUILD=cp311-* cp314-*' >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sendoff-wheels-${{ matrix.os }}-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the sdist
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --sdist --outdir dist
      # Test the installed sdist with the tests it ships, away from its
      # sources.
      - name: Install the sdist and test it
        run: |
          set -euo pipefail
          sdist=$(echo dist/sendoff-*.tar.gz)
          python -m venv .cache/sdist
          .cache/sdist/bin/python -m pip install --disable-pip-version-check \
            "$sdist[test]" mypy==2.4.0
          mkdir .cache/sdist-test
          tar -xzf "$sdist" -C .cache/sdist-test --strip-components=1 \
            --wildcards '*/tests/*' '*/setup.cfg'
          cd .cache/sdist-test
          ../sdist/bin/python -m pytest tests -p no:cacheprovider --no-cov \
            --no-rust-coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sendoff-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
