[package]
name = "sendoff"
version = "1.1.0"
edition = "2024"
description = "The minimal SDF metadata parser"
license = "MIT"
readme = "README.rst"
repository = "https://github.com/pechersky/sendoff"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust/**/*.rs",
    "/sendoff/**/*.py",
    "/sendoff/*.pyi",
    "/pyproject.toml",
    "/README.rst",
    "/LICENSE",
]

[lib]
name = "native"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[features]
# One wheel for every CPython >= 3.11: 1-3% slower overall than a per-version
# build, up to 10% when building dicts and strs.
abi3 = ["pyo3/abi3-py311"]
coverage = []
stubgen = ["pyo3/experimental-inspect"]

[dependencies]
memchr = "2"
memmap2 = "0.9"
pyo3 = "=0.29.3"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
assigning_clones = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
