[package]
name = "sendoff"
version = "0.1.6"
edition = "2024"
description = "The minimal SDF metadata parser"
license = "MIT"
readme = "README.rst"
repository = "https://github.com/pechersky/sendoff"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust/**/*.rs",
    "/sendoff/**/*.py",
    "/sendoff/*.pyi",
    "/pyproject.toml",
    "/README.rst",
    "/LICENSE",
    "/scripts/sdf-unique-record",
]

[lib]
name = "native"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[features]
coverage = []
stubgen = ["pyo3/experimental-inspect"]

[dependencies]
memchr = "2"
memmap2 = "0.9"
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
assigning_clones = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
