[project]
name = "sendoff"
dynamic = ["version"]
description = "The minimal SDF metadata parser"
authors = [{name = "Yakov Pechersky", email = "ypechersky@treeline.bio"}]
license = {text = "MIT"}
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/pechersky/sendoff"

[project.optional-dependencies]
test = [
    "pytest>=7.4.3,<10",
    "xdoctest>=1.1.2,<2",
    "pytest-cov>=4.1.0,<8",
    "pytest-mock>=3.12.0,<4",
    "coverage>=7.3.2,<8",
    "rdkit==2022.9.5; python_version == '3.11'",
    "numpy==1.23.5; python_version == '3.11'",
    "rdkit==2026.3.6; python_version >= '3.12'",
    "numpy>=1.26.4,<3; python_version >= '3.12'",
]
dev = [
    "sendoff[test]",
    "maturin==1.15.0",
    "tox>=4.24,<5",
    "flake8>=6.1.0,<8",
    "flake8-docstrings>=1.7.0,<2",
    "pydocstyle>=6.3.0,<7",
    "black>=23.11.0,<27",
    "towncrier>=23.10.0,<27",
    "pre-commit>=3.5.0,<5",
    "darglint>=1.8.1,<2",
    "tbump>=6.11.0,<7",
    "mypy==1.7.0; python_version == '3.11'",
    "mypy>=1.19,<2; python_version >= '3.12'",
    "isort>=5.12.0,<8",
]

[tool.maturin]
python-source = "."
module-name = "sendoff._native"
include = [
    {path = "LICENSE", format = "sdist"},
    {path = "tests/**/*.py", format = "sdist"},
    {path = "setup.cfg", format = "sdist"},
    {path = "tox.ini", format = "sdist"},
    {path = ".pre-commit-config.yaml", format = "sdist"},
    {path = ".isort.cfg", format = "sdist"},
    {path = ".flake8", format = "sdist"},
]
exclude = ["sendoff/*.so", "sendoff/__pycache__/**"]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.tbump.version]
current = "0.1.6"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[tool.tbump.file]]
src = "Cargo.toml"
search = 'version = "{current_version}"'

[[tool.tbump.before_commit]]
name = "Synchronize the package version in Cargo.lock"
cmd = "cargo check && git add -- Cargo.lock"

[tool.towncrier]
# Usage: (Source: https://github.com/python-trio/trio/blob/master/pyproject.toml)
# - PRs should drop a file like "issuenumber.feature" in newsfragments
#   (or "bugfix", "doc", "removal", "misc")
# - At release time after bumping version number, run:
#   VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --locked
#   .venv/bin/towncrier --draft, then .venv/bin/towncrier
package = "sendoff"
filename = "doc/changelog.rst"
directory = "newsfragments"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"
