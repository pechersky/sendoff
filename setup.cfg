# Python coverage settings. Default source tests also report LLVM Rust coverage;
# tests/conftest.py loads an isolated instrumented build, not the installed wheel.
[coverage:run]
branch = true
source = sendoff
omit = sendoff/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[mypy]
follow_imports = silent
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
check_untyped_defs = True
no_implicit_reexport = True
disallow_untyped_defs = True
ignore_missing_imports = True
strict = True

# pytest
[tool:pytest]
xfail_strict = true
addopts = -ra -vv -s --xdoctest --cov=sendoff --cov-config=setup.cfg --cov-report=term-missing --cov-report=html
